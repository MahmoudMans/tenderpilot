spring:

  datasource:

    url: jdbc:h2:mem:tenderpilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH

    username: sa

    password:


  jpa:

    hibernate:

      ddl-auto: none


  liquibase:

    enabled: true

    change-log: classpath:/db/changelog/db.changelog-master.yaml


tenderpilot:

  integrations:

    opensearch:

      base-url: http://127.0.0.1:1


    ollama:

      base-url: http://127.0.0.1:1


  security:

    issuer: tenderpilot-test

    access-token-secret: tenderpilot-test-access-token-secret-which-is-long-enough

    access-token-ttl: PT15M

    refresh-token-ttl: P7D

    refresh-cookie-name: tenderpilot_refresh

    refresh-cookie-secure: false

# Search projection is disabled for ordinary tests.
# Dedicated Step 9 integration tests override these properties
# and inject a deterministic in-memory fake gateway.
tenderpilot.search.enabled: false
tenderpilot.search.auto-index: false

# Ordinary tests never require a running Ollama daemon.
tenderpilot.local-ai.enabled: false

tenderpilot.rag.enabled: false
