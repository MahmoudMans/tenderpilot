spring:

  application:

    name: tenderpilot-backend


  datasource:

    url: ${DB_URL:jdbc:postgresql://localhost:55432/tenderpilot}

    username: ${DB_USERNAME:tenderpilot}

    password: ${DB_PASSWORD:tenderpilot_dev}

    hikari:

      connection-timeout: 3000

      validation-timeout: 2000


  jpa:

    open-in-view: false

    hibernate:

      ddl-auto: validate


  liquibase:

    change-log: classpath:/db/changelog/db.changelog-master.yaml



server:

  port: ${SERVER_PORT:8080}

  shutdown: graceful



management:

  endpoints:

    web:

      exposure:

        include:

          health,info


  endpoint:

    health:

      show-details: never


  info:

    env:

      enabled: true



info:

  app:

    name: TenderPilot

    version: 0.9.0-SNAPSHOT



tenderpilot:

  app:

    display-name: TenderPilot

    version: 0.6.0-SNAPSHOT


  cors:

    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}


  integrations:

    opensearch:

      base-url: ${OPENSEARCH_URL:http://localhost:19200}


    ollama:

      base-url: ${OLLAMA_URL:http://localhost:11434}


  security:

    issuer: ${ACCESS_TOKEN_ISSUER:tenderpilot-local}

    access-token-secret: ${ACCESS_TOKEN_SECRET:tenderpilot-development-access-token-secret-2026-change-before-production}

    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}

    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}

    refresh-cookie-name: ${REFRESH_COOKIE_NAME:tenderpilot_refresh}

    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}

tenderpilot.ted:

  base-url: ${TED_BASE_URL:https://api.ted.europa.eu}

  search-path: ${TED_SEARCH_PATH:/v3/notices/search}

  default-lookback-days: ${TED_DEFAULT_LOOKBACK_DAYS:7}

  default-limit: ${TED_DEFAULT_LIMIT:25}

  max-limit: ${TED_MAX_LIMIT:100}

  manual-sync-enabled: ${TED_MANUAL_SYNC_ENABLED:true}

tenderpilot.boamp:

  base-url: ${BOAMP_BASE_URL:https://boamp-datadila.opendatasoft.com}

  records-path: ${BOAMP_RECORDS_PATH:/api/explore/v2.1/catalog/datasets/boamp/records}

  dataset-id: ${BOAMP_DATASET_ID:boamp}

  default-lookback-days: ${BOAMP_DEFAULT_LOOKBACK_DAYS:7}

  default-limit: ${BOAMP_DEFAULT_LIMIT:25}

  max-limit: ${BOAMP_MAX_LIMIT:100}

  manual-sync-enabled: ${BOAMP_MANUAL_SYNC_ENABLED:true}

tenderpilot.decp:

  base-url: ${DECP_BASE_URL:https://data.economie.gouv.fr}

  records-path: ${DECP_RECORDS_PATH:/api/explore/v2.1/catalog/datasets/decp-2022-marches-valides/records}

  dataset-id: ${DECP_DATASET_ID:decp-2022-marches-valides}

  default-lookback-days: ${DECP_DEFAULT_LOOKBACK_DAYS:7}

  default-limit: ${DECP_DEFAULT_LIMIT:25}

  max-limit: ${DECP_MAX_LIMIT:100}

  manual-sync-enabled: ${DECP_MANUAL_SYNC_ENABLED:true}

tenderpilot.search:

  enabled: ${OPENSEARCH_ENABLED:true}

  auto-index: ${OPENSEARCH_AUTO_INDEX:true}

  base-url: ${OPENSEARCH_URL:http://localhost:9200}

  index-name: ${OPENSEARCH_PROCUREMENT_INDEX:tenderpilot-opportunities-v1}

  default-size: ${OPENSEARCH_SEARCH_DEFAULT_SIZE:25}

  max-size: ${OPENSEARCH_SEARCH_MAX_SIZE:100}
