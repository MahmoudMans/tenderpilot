spring:

  application:

    name: tenderpilot-backend


  datasource:

    url: ${DB_URL:jdbc:postgresql://localhost:55432/tenderpilot}

    username: ${DB_USERNAME:tenderpilot}

    password: ${DB_PASSWORD:tenderpilot_dev}

    hikari:

      connection-timeout: 3000

      validation-timeout: 2000


  jpa:

    open-in-view: false

    hibernate:

      ddl-auto: validate


  liquibase:

    change-log: classpath:/db/changelog/db.changelog-master.yaml




server:

  port: ${SERVER_PORT:8080}

  shutdown: graceful



management:

  endpoints:

    web:

      exposure:

        include:

          health,info


  endpoint:

    health:

      show-details: never


  info:

    env:

      enabled: true



info:

  app:

    name: TenderPilot

    version: 0.1.0-SNAPSHOT



tenderpilot:

  app:

    display-name: TenderPilot

    version: 0.1.0-SNAPSHOT


  cors:

    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}


  integrations:

    opensearch:

      base-url: ${OPENSEARCH_URL:http://localhost:19200}


    ollama:

      base-url: ${OLLAMA_URL:http://localhost:11434}
