databaseChangeLog:

  - changeSet:

      id: 001-foundation

      author: tenderpilot


      changes:


        - createTable:

            tableName: platform_metadata

            columns:


              - column:

                  name: metadata_key

                  type: VARCHAR(120)

                  constraints:

                    primaryKey: true

                    nullable: false


              - column:

                  name: metadata_value

                  type: VARCHAR(500)

                  constraints:

                    nullable: false


              - column:

                  name: updated_at

                  type: TIMESTAMP

                  defaultValueComputed: CURRENT_TIMESTAMP

                  constraints:

                    nullable: false


        - insert:

            tableName: platform_metadata

            columns:


              - column:

                  name: metadata_key

                  value: schema.version


              - column:

                  name: metadata_value

                  value: "1"
