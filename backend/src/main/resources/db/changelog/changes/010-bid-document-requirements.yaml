databaseChangeLog:

  - changeSet:

      id: 010-bid-document-requirements

      author: tenderpilot

      changes:

        - createTable:

            tableName: organization_bid_documents

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: tender_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: original_filename
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: stored_filename
                  type: VARCHAR(300)
                  constraints:
                    nullable: false

              - column:
                  name: content_type
                  type: VARCHAR(200)

              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: sha256
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: storage_key
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false

              - column:
                  name: note
                  type: VARCHAR(2000)

              - column:
                  name: uploaded_by
                  type: VARCHAR(320)
                  constraints:
                    nullable: false

              - column:
                  name: uploaded_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false


        - addUniqueConstraint:

            tableName: organization_bid_documents

            columnNames: organization_id,tender_id,sha256

            constraintName: uk_bid_document_org_tender_sha


        - addUniqueConstraint:

            tableName: organization_bid_documents

            columnNames: storage_key

            constraintName: uk_bid_document_storage_key


        - addForeignKeyConstraint:

            baseTableName: organization_bid_documents

            baseColumnNames: tender_id

            referencedTableName: procurement_tenders

            referencedColumnNames: id

            constraintName: fk_bid_document_tender

            onDelete: CASCADE


        - createIndex:

            tableName: organization_bid_documents

            indexName: idx_bid_documents_org_tender

            columns:

              - column:
                  name: organization_id

              - column:
                  name: tender_id


        - createIndex:

            tableName: organization_bid_documents

            indexName: idx_bid_documents_sha

            columns:

              - column:
                  name: sha256


        - createTable:

            tableName: organization_bid_requirements

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: tender_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: source_document_id
                  type: UUID

              - column:
                  name: title
                  type: VARCHAR(600)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(3000)

              - column:
                  name: requirement_category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: mandatory
                  type: BOOLEAN
                  constraints:
                    nullable: false

              - column:
                  name: source_reference
                  type: VARCHAR(500)

              - column:
                  name: due_date
                  type: DATE

              - column:
                  name: assigned_to
                  type: VARCHAR(320)

              - column:
                  name: evidence_notes
                  type: VARCHAR(3000)

              - column:
                  name: created_by
                  type: VARCHAR(320)
                  constraints:
                    nullable: false

              - column:
                  name: updated_by
                  type: VARCHAR(320)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false


        - addForeignKeyConstraint:

            baseTableName: organization_bid_requirements

            baseColumnNames: tender_id

            referencedTableName: procurement_tenders

            referencedColumnNames: id

            constraintName: fk_bid_requirement_tender

            onDelete: CASCADE


        - addForeignKeyConstraint:

            baseTableName: organization_bid_requirements

            baseColumnNames: source_document_id

            referencedTableName: organization_bid_documents

            referencedColumnNames: id

            constraintName: fk_bid_requirement_source_document

            onDelete: SET NULL


        - createIndex:

            tableName: organization_bid_requirements

            indexName: idx_bid_requirements_org_tender

            columns:

              - column:
                  name: organization_id

              - column:
                  name: tender_id


        - createIndex:

            tableName: organization_bid_requirements

            indexName: idx_bid_requirements_status

            columns:

              - column:
                  name: status


        - createIndex:

            tableName: organization_bid_requirements

            indexName: idx_bid_requirements_due_date

            columns:

              - column:
                  name: due_date
