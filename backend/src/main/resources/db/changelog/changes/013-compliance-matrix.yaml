databaseChangeLog:

  - changeSet:

      id: 013-compliance-matrix

      author: tenderpilot

      changes:

        - createTable:

            tableName: organization_bid_compliance_reviews

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: tender_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: requirement_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: verdict
                  type: VARCHAR(40)
                  constraints:
                    nullable: false

              - column:
                  name: risk_level
                  type: VARCHAR(40)
                  constraints:
                    nullable: false

              - column:
                  name: evidence_strength
                  type: VARCHAR(40)
                  constraints:
                    nullable: false

              - column:
                  name: review_rationale
                  type: VARCHAR(3000)

              - column:
                  name: mitigation_action
                  type: VARCHAR(3000)

              - column:
                  name: reviewed_by
                  type: VARCHAR(320)
                  constraints:
                    nullable: false

              - column:
                  name: reviewed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false


        - addUniqueConstraint:

            tableName: organization_bid_compliance_reviews

            columnNames: requirement_id

            constraintName: uk_bid_compliance_requirement


        - addForeignKeyConstraint:

            baseTableName: organization_bid_compliance_reviews

            baseColumnNames: tender_id

            referencedTableName: procurement_tenders

            referencedColumnNames: id

            constraintName: fk_bid_compliance_tender

            onDelete: CASCADE


        - addForeignKeyConstraint:

            baseTableName: organization_bid_compliance_reviews

            baseColumnNames: requirement_id

            referencedTableName: organization_bid_requirements

            referencedColumnNames: id

            constraintName: fk_bid_compliance_requirement

            onDelete: CASCADE


        - createIndex:

            tableName: organization_bid_compliance_reviews

            indexName: idx_bid_compliance_org_tender

            columns:

              - column:
                  name: organization_id

              - column:
                  name: tender_id


        - createIndex:

            tableName: organization_bid_compliance_reviews

            indexName: idx_bid_compliance_verdict

            columns:

              - column:
                  name: verdict


        - createIndex:

            tableName: organization_bid_compliance_reviews

            indexName: idx_bid_compliance_risk

            columns:

              - column:
                  name: risk_level
