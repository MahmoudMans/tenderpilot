databaseChangeLog:

  - changeSet:

      id: 002-identity-organizations

      author: tenderpilot

      changes:

        - createTable:

            tableName: app_users

            columns:

              - column:

                  name: id

                  type: UUID

                  constraints:

                    primaryKey: true

                    nullable: false


              - column:

                  name: email

                  type: VARCHAR(320)

                  constraints:

                    nullable: false


              - column:

                  name: normalized_email

                  type: VARCHAR(320)

                  constraints:

                    nullable: false


              - column:

                  name: password_hash

                  type: VARCHAR(255)

                  constraints:

                    nullable: false


              - column:

                  name: full_name

                  type: VARCHAR(160)

                  constraints:

                    nullable: false


              - column:

                  name: status

                  type: VARCHAR(40)

                  constraints:

                    nullable: false


              - column:

                  name: created_at

                  type: TIMESTAMP WITH TIME ZONE

                  constraints:

                    nullable: false


              - column:

                  name: updated_at

                  type: TIMESTAMP WITH TIME ZONE

                  constraints:

                    nullable: false


        - addUniqueConstraint:

            tableName: app_users

            columnNames: normalized_email

            constraintName: uk_app_users_normalized_email


        - createIndex:

            tableName: app_users

            indexName: idx_app_users_email

            columns:

              - column:

                  name: email


        - createTable:

            tableName: organizations

            columns:

              - column:

                  name: id

                  type: UUID

                  constraints:

                    primaryKey: true

                    nullable: false


              - column:

                  name: name

                  type: VARCHAR(180)

                  constraints:

                    nullable: false


              - column:

                  name: slug

                  type: VARCHAR(190)

                  constraints:

                    nullable: false


              - column:

                  name: created_at

                  type: TIMESTAMP WITH TIME ZONE

                  constraints:

                    nullable: false


              - column:

                  name: updated_at

                  type: TIMESTAMP WITH TIME ZONE

                  constraints:

                    nullable: false


        - addUniqueConstraint:

            tableName: organizations

            columnNames: slug

            constraintName: uk_organizations_slug


        - createTable:

            tableName: organization_memberships

            columns:

              - column:

                  name: id

                  type: UUID

                  constraints:

                    primaryKey: true

                    nullable: false


              - column:

                  name: organization_id

                  type: UUID

                  constraints:

                    nullable: false


              - column:

                  name: user_id

                  type: UUID

                  constraints:

                    nullable: false


              - column:

                  name: role

                  type: VARCHAR(40)

                  constraints:

                    nullable: false


              - column:

                  name: created_at

                  type: TIMESTAMP WITH TIME ZONE

                  constraints:

                    nullable: false


        - addForeignKeyConstraint:

            baseTableName: organization_memberships

            baseColumnNames: organization_id

            referencedTableName: organizations

            referencedColumnNames: id

            constraintName: fk_memberships_organization

            onDelete: CASCADE


        - addForeignKeyConstraint:

            baseTableName: organization_memberships

            baseColumnNames: user_id

            referencedTableName: app_users

            referencedColumnNames: id

            constraintName: fk_memberships_user

            onDelete: CASCADE


        - addUniqueConstraint:

            tableName: organization_memberships

            columnNames: organization_id,user_id

            constraintName: uk_membership_org_user


        - createIndex:

            tableName: organization_memberships

            indexName: idx_memberships_user

            columns:

              - column:

                  name: user_id


        - createIndex:

            tableName: organization_memberships

            indexName: idx_memberships_org

            columns:

              - column:

                  name: organization_id


        - createTable:

            tableName: auth_refresh_tokens

            columns:

              - column:

                  name: id

                  type: UUID

                  constraints:

                    primaryKey: true

                    nullable: false


              - column:

                  name: user_id

                  type: UUID

                  constraints:

                    nullable: false


              - column:

                  name: organization_id

                  type: UUID

                  constraints:

                    nullable: false


              - column:

                  name: token_hash

                  type: VARCHAR(64)

                  constraints:

                    nullable: false


              - column:

                  name: expires_at

                  type: TIMESTAMP WITH TIME ZONE

                  constraints:

                    nullable: false


              - column:

                  name: created_at

                  type: TIMESTAMP WITH TIME ZONE

                  constraints:

                    nullable: false


              - column:

                  name: last_used_at

                  type: TIMESTAMP WITH TIME ZONE


              - column:

                  name: revoked_at

                  type: TIMESTAMP WITH TIME ZONE


        - addUniqueConstraint:

            tableName: auth_refresh_tokens

            columnNames: token_hash

            constraintName: uk_refresh_tokens_hash


        - addForeignKeyConstraint:

            baseTableName: auth_refresh_tokens

            baseColumnNames: user_id

            referencedTableName: app_users

            referencedColumnNames: id

            constraintName: fk_refresh_tokens_user

            onDelete: CASCADE


        - addForeignKeyConstraint:

            baseTableName: auth_refresh_tokens

            baseColumnNames: organization_id

            referencedTableName: organizations

            referencedColumnNames: id

            constraintName: fk_refresh_tokens_organization

            onDelete: CASCADE


        - createIndex:

            tableName: auth_refresh_tokens

            indexName: idx_refresh_tokens_user

            columns:

              - column:

                  name: user_id


        - createIndex:

            tableName: auth_refresh_tokens

            indexName: idx_refresh_tokens_expiration

            columns:

              - column:

                  name: expires_at
